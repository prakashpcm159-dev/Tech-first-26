<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TechFest 2026 | Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/Responsive.css">
</head>

<body>
    <header class="nav">
        <div class="container nav-inner"><a class="logo" href="index.html">TECH<span>FEST</span> 26</a><label
                class="menu mobile-only" for="nav"><i class="fa-solid fa-bars"></i></label><input id="nav"
                class="mobile-toggle" type="checkbox" hidden>
            <nav class="links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="ticket.html">Tickets</a>
                <a href="venue.html">Venue</a>
                <a href="sponsors.html">Sponsors</a>
                <a class="active" href="register.html">Register</a>
            </nav>
        </div>
    </header>
    <section class="page-head">
        <div class="container"><span class="eyebrow">JOIN TECHFEST</span>
            <h1>Reserve your place.</h1>
            <p class="muted">Complete the form below to register for TechFest 2026.</p>
        </div>
    </section>
    <main>
        <section class="section">
            <div class="container">
                <form class="card form" action="#" method="post">
                    <div class="field"><label for="name"><i class="fa-solid fa-user"></i> Full Name</label><input
                            class="input" id="name" name="name" type="text" placeholder="Enter your full name" required>
                    </div>
                    <div class="field"><label for="email"><i class="fa-solid fa-envelope"></i> Email</label><input
                            class="input" id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field"><label for="phone"><i class="fa-solid fa-phone"></i> Phone</label><input
                            class="input" id="phone" name="phone" type="tel" placeholder="Enter phone number" required>
                    </div>
                    <div class="field"><label><i class="fa-solid fa-ticket"></i> Ticket Type</label>
                        <div class="choices"><label class="choice"><input type="radio" name="ticket" value="standard"
                                    required> Standard</label><label class="choice"><input type="radio" name="ticket"
                                    value="vip"> VIP</label><label class="choice"><input type="radio" name="ticket"
                                    value="pro"> Pro</label></div>
                    </div><label class="check"><input type="checkbox" required> I agree to the event terms and
                        conditions.</label><button class="btn btn-primary"
                        style="margin-top:24px;border:0;width:100%;justify-content:center" type="submit"><i
                            class="fa-solid fa-paper-plane"></i> Submit Registration</button>
                </form>
            </div>
        </section>
    </main>
     <footer class="border-t border-white/10">
    <div class="max-w-7xl mx-auto px-5 py-10 flex flex-col md:flex-row justify-between gap-5">
      <div>
        <h2 class="text-2xl font-black text-cyan-400">TechFest26</h2>
        <p class="text-slate-500 mt-2">Build. Learn. Connect. Innovate.</p>
      </div>
      <div class="text-slate-500 text-sm md:text-right">
        <p>© 2026 TechFest. All rights reserved.</p>
        <p class="mt-2">Jaipur, Rajasthan, India</p>
      </div>
    </div>
  </footer>
</body>

</html>
